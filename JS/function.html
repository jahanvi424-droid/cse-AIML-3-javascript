(()=>console.log( " IIFE using arrow"))();
//call back function
function mul(callback){
    var num1=10;
    console.log("first no. is"+num1);
    var num2=20;
    console.log("second no. is"+num2);
    var res=num1*num2;
    callback(res);
}

}
catch(error){
console.log( " not fetched"+error);
